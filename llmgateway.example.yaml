version: 1

# Providers are tried in order.
# When the current provider exhausts `settings.transport_retries`,
# the gateway automatically switches to the next one.
# After a provider succeeds, it is remembered in provider-state.json
# and dynamically moved to the front for later requests.
providers:
  - provider_type: openai
    api_style: responses
    base_url: ${LLM_API_BASE_URL_1:-https://api.openai.com/v1}
    api_key: ${LLM_API_KEY_1}
    headers: {}
    model_map: {}

  - provider_type: anthropic
    api_style: anthropic
    base_url: ${LLM_API_BASE_URL_2:-https://api.anthropic.com}
    api_key: ${LLM_API_KEY_2}
    headers:
      anthropic-version: "2023-06-01"
    model_map: {}

  - provider_type: litellm
    api_style: litellm
    base_url: ${LLM_API_BASE_URL_3:-http://localhost:4000}
    api_key: ${LLM_API_KEY_3}
    headers: {}
    model_map:
      gpt-5.4: openai/gpt-5.4
      gpt-5.4-mini: openai/gpt-5.4-mini

  # Copy this block to add as many providers as needed.
  # - provider_type: openai
  #   api_style: responses
  #   base_url: ${LLM_API_BASE_URL_4}
  #   api_key: ${LLM_API_KEY_4}
  #   headers: {}
  #   model_map: {}

settings:
  fallback_model: gpt-5.4-mini
  strong_model: gpt-5.4
  weak_model: gpt-5.4-mini
  strong_reasoning_effort: high
  weak_reasoning_effort: low
  max_concurrent: 32
  retry_max: 2
  transport_retries: 2
  timeout: 30

tasks:
  analysis:
    tier: weak
    max_tokens: 4000

  planner:
    tier: strong
    max_tokens: 8000

  summarizer:
    model: gpt-5.4-mini
    temperature: 0.2
    max_tokens: 3000
