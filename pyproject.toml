[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmgateway"
version = "0.1.2"
description = "Generic async LLM gateway with concurrency, retries, and JSON helpers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "bfly", email = "bfly123@126.com"},
]
maintainers = [
    {name = "bfly", email = "bfly123@126.com"},
]
keywords = ["llm", "gateway", "async", "openai", "anthropic", "litellm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "pytest-asyncio",
    "twine",
]

[project.urls]
Homepage = "https://github.com/seemseam/llmgateway"
Repository = "https://github.com/seemseam/llmgateway"
Issues = "https://github.com/seemseam/llmgateway/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["llmgateway*"]

[tool.setuptools.package-data]
llmgateway = ["py.typed"]
